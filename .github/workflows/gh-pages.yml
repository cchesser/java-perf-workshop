name: github pages

on:
  push:
    branches:
      - main  # Set a branch to deploy

jobs:
  deploy:
    runs-on:  ubuntu-latest
    defaults:
      run:
        working-directory: ./docs
    steps:
      - uses: actions/checkout@v2
        with:
          submodules: true
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Verify Dart Sass setup
        run: |
          SASS_DIR="$(mise where aqua:sass/dart-sass)/dart-sass"
          chmod u+rx "$SASS_DIR/sass" "$SASS_DIR/src/dart"
          "$SASS_DIR/sass" --embedded --version

      - run: npm install
      - run: hugo
        env:
          HUGO_ENV: production

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: docs/public
          cname: jvmperf.net
